version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-toolchain:
        dependency-type: development
        # Major tooling releases can change lint and type semantics and need isolated review.
        update-types:
          - minor
          - patch
    ignore:
      # ESLint 10 requires coordinated plugin and configuration migrations.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-plugin-unicorn
        update-types:
          - version-update:semver-major

      # TypeScript 7 is unsupported by the current typescript-eslint release.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # Keep ambient Node APIs aligned with the repository's supported runtime policy.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
